name: tests

# 第1段階（unit）: GDAL / PDAL なしで実行できるテストだけを回す。
# 第2段階（gdal）: Ubuntu 24.04 のパッケージの GDAL（3.8系）と NumPy・SciPy で、
# GDAL を使うテスト（結合テスト・入力変換）も回す。
# どちらでも、PDAL を必要とするテストは自動的にスキップされる
# （スキップ分は未実行であり、合格を意味しない）。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: fme_csmap_pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install numpy scipy
      - name: Compile
        run: python -m compileall -q .
      - name: Unit tests
        run: python -m unittest discover -s . -p "test_*.py" -v

  gdal:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: fme_csmap_pipeline
    steps:
      - uses: actions/checkout@v4
      - name: Install GDAL, NumPy and SciPy (Ubuntu packages)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-gdal python3-numpy python3-scipy
      - name: Show versions
        run: /usr/bin/python3 -c "from osgeo import gdal; import numpy, scipy; print('GDAL', gdal.VersionInfo('RELEASE_NAME'), 'numpy', numpy.__version__, 'scipy', scipy.__version__)"
      - name: Unit and GDAL integration tests
        run: /usr/bin/python3 -m unittest discover -s . -p "test_*.py" -v
